name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          mkdir -p android-build
          unzip -q -o "RS-Chai-Chilli-Cafe-Android (1).zip" -d android-build

          PROJECT_DIR=$(dirname "$(find android-build -name gradlew -type f | head -n 1)")
          echo "Project found at: $PROJECT_DIR"

          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RS-Chai-Chilli-Cafe-debug
          path: android-build/**/app/build/outputs/apk/debug/app-debug.apk
