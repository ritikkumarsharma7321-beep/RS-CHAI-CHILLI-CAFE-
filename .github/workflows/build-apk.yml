name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          mkdir -p android-build
          unzip -q "RS-Chai-Chilli-Cafe-Android (1).zip" -d android-build

          echo "=== Extracted files ==="
          find android-build -maxdepth 4 -type f | head -100

          echo "=== Searching gradlew ==="
          GRADLEW=$(find android-build -type f -name gradlew | head -1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew file nahi mila!"
            echo "ZIP ke andar Android Gradle project/wrapper missing hai."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")
          echo "Project found at: $PROJECT_DIR"

          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RS-Chai-Chilli-Cafe-debug
          path: android-build/**/app/build/outputs/apk/debug/app-debug.apk
