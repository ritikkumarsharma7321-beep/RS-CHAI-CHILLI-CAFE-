name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract Android project
        run: |
          rm -rf android-build
          mkdir -p android-build
          unzip -q "RS-Chai-Chilli-Cafe-Android (1).zip" -d android-build

          echo "=== Project files ==="
          find android-build -maxdepth 3 -type f | sort

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10"

      - name: Build APK
        working-directory: android-build
        run: |
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RS-Chai-Chilli-Cafe-debug
          path: android-build/**/build/outputs/apk/debug/*.apk
